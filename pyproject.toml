[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "A local-first assistant core that runs on Ollama models."
requires-python = ">=3.11"
dependencies = ["psutil", "send2trash"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["jarvis_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
